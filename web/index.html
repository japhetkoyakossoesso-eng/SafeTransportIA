<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Analyse des accidents de transport à partir de sources publiques" />
    <meta name="theme-color" content="#2f47d6" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SafeTransport AI</title>
    <script>
      // évite un flash blanc avant le chargement du thème sombre
      try {
        var t = localStorage.getItem('safetransport.theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'sombre' : 'clair';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
