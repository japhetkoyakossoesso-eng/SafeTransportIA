server:
  port: ${API_PORT:8080}

spring:
  application:
    name: safetransport-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:safetransport}
    username: ${API_DB_USER:app_api}
    password: ${API_DB_PASSWORD:change-me-api}
    hikari:
      # l'API démarre même si la base n'est pas prête
      initialization-fail-timeout: -1

safetransport:
  jwt:
    # à changer en production (32 caractères minimum)
    secret: ${API_JWT_SECRET:secret-de-dev-a-changer-absolument-0123456789}
    duree-heures: 8

springdoc:
  swagger-ui:
    path: /api/docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
