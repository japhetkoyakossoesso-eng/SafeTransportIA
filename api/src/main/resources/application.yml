server:
  port: ${API_PORT:8080}

spring:
  application:
    name: safetransport-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:safetransport}
    username: ${API_DB_USER:app_api}
    password: ${API_DB_PASSWORD:change-me-api}
    hikari:
      # L'API démarre même si la base n'est pas encore prête ; /api/v1/health le signale.
      initialization-fail-timeout: -1

# Le schéma appartient aux migrations Flyway de db/ : l'API ne crée ni ne modifie de tables.

management:
  endpoints:
    web:
      exposure:
        include: health,info
