name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  db:
    name: Base de données (Flyway + 29 tests SQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Préparer .env
        run: cp .env.example .env
      - name: Construire l'image PostgreSQL + PostGIS + pgvector
        run: docker compose build db
      - name: Démarrer la base et appliquer les migrations
        run: |
          docker compose up -d --wait db
          docker compose run --rm flyway
      - name: Tests de contraintes
        run: |
          docker compose exec -T db psql -v ON_ERROR_STOP=1 -U safetransport_owner -d safetransport \
            -f - < db/tests/900_tests.sql
      - name: Diagramme de classes à jour
        run: |
          make uml
          git diff --exit-code docs/03-uml/classes.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import BAAC sur le jeu de test
        working-directory: ai
        env:
          DB_HOST: localhost
          ETL_TEST_DB: '1'
        run: |
          pip install -r requirements-dev.txt
          pytest -q tests/test_baac_import_db.py
      - name: Arrêter
        if: always()
        run: docker compose down -v

  api:
    name: API Spring Boot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify

  ai:
    name: Services IA FastAPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  admin:
    name: Back-office Laravel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pdo_sqlite
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  web:
    name: Front Vue.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  notifications:
    name: Notifications Node.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notifications
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  compose:
    name: Validation docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config -q
