name: safetransport

services:
  db:
    build: ./db
    image: safetransport/db:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD}
      BI_DB_PASSWORD: ${BI_DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # applique les migrations puis s'arrête
  flyway:
    image: flyway/flyway:11
    command: -connectRetries=20 migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS}
    volumes:
      - ./db/migrations:/flyway/migrations:ro
      - ./db/seed:/flyway/seed:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      API_DB_USER: ${API_DB_USER}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      flyway:
        condition: service_completed_successfully

  ai:
    build: ./ai
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      AI_DB_USER: ${AI_DB_USER}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
    ports:
      - "${AI_PORT:-8000}:8000"
    depends_on:
      flyway:
        condition: service_completed_successfully

  admin:
    build: ./admin
    environment:
      APP_KEY: ${ADMIN_APP_KEY}
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${ADMIN_DB_USER}
      DB_PASSWORD: ${ADMIN_DB_PASSWORD}
    ports:
      - "${ADMIN_PORT:-8001}:8000"
    depends_on:
      flyway:
        condition: service_completed_successfully

  notifications:
    build: ./notifications
    ports:
      - "${NOTIFICATIONS_PORT:-3000}:3000"

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api
      - ai

volumes:
  db-data:
